<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#14212b;--muted:#5c6b77;--line:#c9d3db;--accent:#0b6e8a;--accent-ink:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--panel:#17252f;--ink:#e8eef2;--muted:#93a4b0;--line:#2c3e4b;--accent:#4fb8d6;--accent-ink:#06222c;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1a22;--panel:#17252f;--ink:#e8eef2;--muted:#93a4b0;--line:#2c3e4b;--accent:#4fb8d6;--accent-ink:#06222c;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:440px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--muted)}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
label,legend{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input[type=number]{width:100%;font:500 1.2rem "IBM Plex Mono",monospace;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.field{margin-bottom:16px}
fieldset{border:0;padding:0;margin:0 0 16px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ops label{margin:0;font-weight:400}
.ops input{position:absolute;opacity:0}
.ops span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:8px;font:500 1.3rem "IBM Plex Mono",monospace;cursor:pointer;background:var(--bg)}
.ops input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ops input:focus-visible+span,input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px}
button{font:600 1rem "IBM Plex Sans",sans-serif;padding:12px 16px;border-radius:8px;border:1px solid var(--accent);cursor:pointer}
button.go{flex:1;background:var(--accent);color:var(--accent-ink)}
button.clear{background:transparent;color:var(--accent)}
output{display:block;margin-top:16px;padding:14px;border-radius:8px;border:1px dashed var(--line);font:500 1.5rem "IBM Plex Mono",monospace;min-height:3.2rem;overflow-wrap:anywhere}
output.error{color:var(--err);font:600 1rem "IBM Plex Sans",sans-serif}
h2{font-size:1rem;margin:24px 0 8px}
ul{list-style:none;margin:0;padding:0;font:500 .95rem "IBM Plex Mono",monospace}
li{padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.empty{color:var(--muted);font-family:"IBM Plex Sans",sans-serif}
</style>
</head>
<body>
<main>
  <h1>Basic Calculator</h1>
  <p class="sub">Enter two numbers, choose an operation, and calculate.</p>

  <form id="calc" novalidate>
    <div class="field">
      <label for="a">First number</label>
      <input type="number" id="a" step="any" inputmode="decimal" placeholder="0">
    </div>

    <fieldset>
      <legend>Operation</legend>
      <div class="ops">
        <label><input type="radio" name="op" value="+" checked><span title="Add">+</span></label>
        <label><input type="radio" name="op" value="-"><span title="Subtract">−</span></label>
        <label><input type="radio" name="op" value="*"><span title="Multiply">×</span></label>
        <label><input type="radio" name="op" value="/"><span title="Divide">÷</span></label>
      </div>
    </fieldset>

    <div class="field">
      <label for="b">Second number</label>
      <input type="number" id="b" step="any" inputmode="decimal" placeholder="0">
    </div>

    <div class="btns">
      <button type="submit" class="go">Calculate</button>
      <button type="reset" class="clear">Clear</button>
    </div>

    <output id="result" for="a b" aria-live="polite">Result appears here</output>
  </form>

  <h2>History</h2>
  <ul id="history"><li class="empty">No calculations yet.</li></ul>
</main>

<script>
const form = document.getElementById('calc');
const out = document.getElementById('result');
const list = document.getElementById('history');
const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
let history = [];

function show(text, isError) {
  out.textContent = text;
  out.className = isError ? 'error' : '';
}

function calculate(x, y, op) {
  switch (op) {
    case '+': return x + y;
    case '-': return x - y;
    case '*': return x * y;
    case '/': return x / y;
  }
}

form.addEventListener('submit', function (e) {
  e.preventDefault();
  const aVal = document.getElementById('a').value.trim();
  const bVal = document.getElementById('b').value.trim();
  const op = form.elements['op'].value;

  if (aVal === '' || bVal === '') {
    show('Enter both numbers to continue.', true);
    return;
  }
  const x = parseFloat(aVal), y = parseFloat(bVal);
  if (isNaN(x) || isNaN(y)) {
    show('Both values must be valid numbers.', true);
    return;
  }
  if (op === '/' && y === 0) {
    show('Cannot divide by zero. Change the second number.', true);
    return;
  }

  // round to avoid floating-point noise (e.g. 0.1 + 0.2)
  const result = parseFloat(calculate(x, y, op).toPrecision(12));
  show(String(result), false);

  history.unshift(x + ' ' + symbols[op] + ' ' + y + ' = ' + result);
  history = history.slice(0, 8);
  list.innerHTML = '';
  history.forEach(function (item) {
    const li = document.createElement('li');
    li.textContent = item;
    list.appendChild(li);
  });
});

form.addEventListener('reset', function () {
  show('Result appears here', false);
  document.getElementById('a').focus();
});
</script>
</body>
</html>
